---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cryptpad-helm.fullname" . }}
  labels:
    {{- include "cryptpad-helm.labels" . | nindent 4 }}
{{- $config := deepCopy (.Values.config | default dict) -}}
{{- $_ := set $config "httpUnsafeOrigin" (include "cryptpad-helm.mainDomain" . | trim) -}}
{{- $_ := set $config "httpSafeOrigin" (include "cryptpad-helm.sandboxDomain" . | trim) -}}
{{- $infra := deepCopy (.Values.infra | default dict) -}}
{{- $public := deepCopy (.Values.infra.public | default dict) -}}
{{- $_ := set $public "origin" (include "cryptpad-helm.mainDomain" . | trim) -}}
{{- $_ := set $public "sandboxOrigin" (include "cryptpad-helm.sandboxDomain" . | trim) -}}
{{- $_ := set $infra "public" $public -}}
{{- range $name, $content := .Values.extraConfigFiles }}
{{- if or (eq $name "config.js") (eq $name "infra.js") (eq $name "application_config.js") }}
{{- fail (printf "extraConfigFiles key %q collides with a file generated by this chart" $name) }}
{{- end }}
{{- end }}
data:
  config.js: |
    /* globals module */

    module.exports = {{ $config | toPrettyJson | indent 4 }};
  infra.js: |
    module.exports = {{ $infra | toPrettyJson | indent 4 }};
  application_config.js: |
    /*
    * You can override the configurable values from this file.
    * The recommended method is to make a copy of this file (/customize.dist/application_config.js)
      in a 'customize' directory (/customize/application_config.js).
    * If you want to check all the configurable values, you can open the internal configuration file
      but you should not change it directly (/common/application_config_internal.js)
    */
    define(['/common/application_config_internal.js'], function (AppConfig) {

        {{- range $key, $value := .Values.application_config }}
          AppConfig.{{ $key }} =  {{ $value | toJson }};
        {{- end }}

        return AppConfig;
    });
{{- range $name, $content := .Values.extraConfigFiles }}
  {{ $name }}: |
    {{- $content | trimSuffix "\n" | nindent 4 }}
{{- end -}}

